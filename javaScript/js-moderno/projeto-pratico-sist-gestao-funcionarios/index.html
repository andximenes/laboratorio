<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio prático - Cadastro de funcionários</title>
</head>
<body>
    <main class="container">
        <header>
            <img class="icon-header" src="" alt="">
            <h1 class="title">PeopleManage</h1>
            <p class="subtitle">Gestão de funcionários</p>
        </header>
        <div class="dashboard">
            <div class="employees">
                <span>employees</span>
                <span>4</span>
            </div>
            <div class="monthly-sheet">
                <span>monthly sheet</span>
                <span>R$ 15.500</span>
            </div>
            <div class="average-salary">
                <span>Average Salary</span>
                <span>R$ 3.875</span>
            </div>
        </div>

        <form action="">
            <div class="box">
                <label for="fullName">Full Name</label>
                <input type="text" placeholder="John Doe" id="" required>
            </div>
            <div class="box">
                <label for="age">Age</label>
                <input type="number" placeholder="18" id="" required>
            </div>            
            <div class="box">
                <label for="salary">Salary</label>
                <input type="number" name="salary" id="" required>
            </div>
            <div class="box">
                <label for="city">City</label>
                <input type="text" id="" placeholder="Brasília" required>
            </div>
            <div class="box">
                <label for="state">State</label>
                <select name="state" id="">
                    <option value="">Acre</option>
                    <option value="">Amapá </option>
                    <option value="">Amazonas </option>
                    <option value="">Pará </option>
                    <option value="">Rondônia </option>
                    <option value="">Roraima </option>
                    <option value="">Tocantins </option>
                    <option value="">Alagoas </option>
                    <option value="">Bahia </option>
                    <option value="">Ceará </option>
                    <option value="">Maranhão </option>
                    <option value="">Paraíba </option>
                    <option value="">Pernambuco </option>
                    <option value="">Piauí </option>
                    <option value="">Rio Grande do Norte</option>
                    <option value="">Sergipe </option>
                    <option value="">Goiás </option>
                    <option value="">Mato Grosso</option>
                    <option value="">Mato Grosso do Sul</option>
                    <option value="">Distrito Federal</option>
                    <option value="">Espírito Santo</option>
                    <option value="">Minas Gerais</option>
                    <option value="">Rio de Janeiro</option>
                    <option value="">São Paulo</option>
                    <option value="">Paraná </option>
                    <option value=""> Rio Grande do Sul</option>
                    <option value="">Santa Catarina</option>
                </select>
            </div>
        </form>
    </main>
</body>
</html>
